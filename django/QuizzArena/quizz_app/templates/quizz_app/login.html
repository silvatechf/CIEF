{% extends 'quizz_app/base.html' %}

{% block title %}Login - QuizzMaster{% endblock %}

{% block content %}
<style>
    .login-wrapper {
        min-height: calc(100vh - 160px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
        box-sizing: border-box;
    }

    .login-card {
        background: #ffffff;
        width: 100%;
        max-width: 440px;
        padding: 40px;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        text-align: center;
    }

    .login-header .icon {
        font-size: 2.5rem;
        margin-bottom: 8px;
    }

    .login-header h1 {
        font-size: 1.8rem;
        color: #2d3748;
        margin: 0 0 6px 0;
        font-weight: 700;
    }

    .login-header p {
        color: #718096;
        font-size: 0.95rem;
        margin-bottom: 28px;
    }

    .login-form .form-group {
        text-align: left;
        margin-bottom: 20px;
    }

    .login-form label {
        display: block;
        font-weight: 600;
        font-size: 0.88rem;
        color: #4a5568;
        margin-bottom: 6px;
    }

    .login-form .form-control {
        width: 100%;
        padding: 12px 14px;
        border: 1.5px solid #e2e8f0;
        border-radius: 8px;
        font-size: 0.95rem;
        box-sizing: border-box;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
        outline: none;
    }

    .login-form .form-control:focus {
        border-color: #6c5ce7;
        box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.15);
    }

    .input-hint {
        font-size: 0.78rem;
        color: #a0aec0;
        margin-top: 5px;
    }

    .btn-submit {
        width: 100%;
        background: linear-gradient(135deg, #6c5ce7, #5b4bc4);
        color: #ffffff;
        border: none;
        padding: 14px;
        font-size: 1rem;
        font-weight: 600;
        border-radius: 8px;
        cursor: pointer;
        margin-top: 10px;
        transition: transform 0.1s ease, background 0.2s ease;
    }

    .btn-submit:hover {
        background: linear-gradient(135deg, #5b4bc4, #4a3ab1);
        transform: translateY(-1px);
    }

    .btn-submit:disabled {
        background: #a0aec0;
        cursor: not-allowed;
        transform: none;
    }

    .login-footer {
        margin-top: 24px;
        padding-top: 20px;
        border-top: 1px solid #edf2f7;
        font-size: 0.9rem;
        color: #718096;
    }

    .login-footer a {
        color: #6c5ce7;
        text-decoration: none;
        font-weight: 600;
    }

    .login-footer a:hover {
        text-decoration: underline;
    }
</style>

<div class="login-wrapper">
    <div class="login-card">
        <div class="login-header">
            <div class="icon">🎯</div>
            <h1>Iniciar sesión</h1>
            <p>Accede a tu cuenta de QuizzMaster</p>
        </div>

        <form id="loginForm" class="login-form" method="POST">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next }}">

            <div class="form-group">
                <label for="username">Usuario o correo electrónico</label>
                <input 
                    type="text" 
                    id="username" 
                    name="username" 
                    class="form-control" 
                    placeholder="Ingresa tu usuario o correo"
                    autocomplete="off"
                    required
                >
                <div class="input-hint">Puedes usar tu usuario o correo electrónico registrado</div>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    class="form-control" 
                    placeholder="Ingresa tu contraseña"
                    autocomplete="off"
                    required
                >
            </div>

            <button type="submit" class="btn-submit">
                🔐 Iniciar Sesión
            </button>
        </form>

        <div class="login-footer">
            <p>¿No tienes una cuenta? <a href="{% url 'quizz_app:register' %}">Regístrate</a></p>
        </div>
    </div>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        
        if (!username || !password) {
            e.preventDefault();
            return false;
        }
        
        const button = this.querySelector('button[type="submit"]');
        button.innerHTML = '⏳ Verificando...';
        button.disabled = true;
        
        return true;
    });
</script>
{% endblock %}
