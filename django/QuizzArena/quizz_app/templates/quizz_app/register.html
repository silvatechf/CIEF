{% extends 'quizz_app/base.html' %}

{% block title %}Registro - QuizzMaster{% endblock %}

{% block content %}
<style>
    .register-wrapper {
        min-height: calc(100vh - 160px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
        box-sizing: border-box;
    }

    .register-card {
        background: #ffffff;
        width: 100%;
        max-width: 440px;
        padding: 40px;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        text-align: center;
    }

    .register-header .icon {
        font-size: 2.5rem;
        margin-bottom: 8px;
    }

    .register-header h1 {
        font-size: 1.8rem;
        color: #2d3748;
        margin: 0 0 6px 0;
        font-weight: 700;
    }

    .register-header p {
        color: #718096;
        font-size: 0.95rem;
        margin-bottom: 28px;
    }

    .register-form .form-group {
        text-align: left;
        margin-bottom: 20px;
    }

    .register-form label {
        display: block;
        font-weight: 600;
        font-size: 0.88rem;
        color: #4a5568;
        margin-bottom: 6px;
    }

    .register-form .form-control {
        width: 100%;
        padding: 12px 14px;
        border: 1.5px solid #e2e8f0;
        border-radius: 8px;
        font-size: 0.95rem;
        box-sizing: border-box;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
        outline: none;
    }

    .register-form .form-control:focus {
        border-color: #6c5ce7;
        box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.15);
    }

    .btn-submit {
        width: 100%;
        background: linear-gradient(135deg, #6c5ce7, #5b4bc4);
        color: #ffffff;
        border: none;
        padding: 14px;
        font-size: 1rem;
        font-weight: 600;
        border-radius: 8px;
        cursor: pointer;
        margin-top: 10px;
        transition: transform 0.1s ease, background 0.2s ease;
    }

    .btn-submit:hover {
        background: linear-gradient(135deg, #5b4bc4, #4a3ab1);
        transform: translateY(-1px);
    }

    .register-footer {
        margin-top: 24px;
        font-size: 0.9rem;
        color: #718096;
    }

    .register-footer a {
        color: #6c5ce7;
        text-decoration: none;
        font-weight: 600;
    }

    .register-footer a:hover {
        text-decoration: underline;
    }
</style>

<div class="register-wrapper">
    <div class="register-card">
        <div class="register-header">
            <div class="icon">🎯</div>
            <h1>Crear cuenta</h1>
            <p>Las cuentas nuevas se registran como alumnos.</p>
        </div>

        <form class="register-form" method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label for="username">Nombre de usuario</label>
                <input type="text" id="username" name="username" class="form-control" placeholder="Tu usuario" required>
            </div>
            <div class="form-group">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="correo@ejemplo.com" required>
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>
            <div class="form-group">
                <label for="password_confirmation">Confirmar contraseña</label>
                <input type="password" id="password_confirmation" name="password_confirmation" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-submit">Crear cuenta</button>
        </form>

        <div class="register-footer">
            <p>¿Ya tienes una cuenta? <a href="{% url 'quizz_app:login' %}">Inicia sesión</a></p>
        </div>
    </div>
</div>
{% endblock %}
