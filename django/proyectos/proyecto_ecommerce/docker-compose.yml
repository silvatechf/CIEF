services:
  web:
    build: .
    container_name: ecommerce_web
    command: sh -c "python manage.py migrate && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=django-insecure-chave-de-desenvolvimento-local
      - DEBUG=True
      - STRIPE_PUBLIC_KEY=pk_test_12345
      - STRIPE_SECRET_KEY=sk_test_12345
      - STRIPE_WEBHOOK_SECRET=whsec_12345
    restart: always

volumes:
  static_volume:
  media_volume: