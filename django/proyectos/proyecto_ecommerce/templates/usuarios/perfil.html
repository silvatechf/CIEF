{% extends 'base.html' %}

{% block title %}Mi Perfil | {{ block.super }}{% endblock %}

{% block content %}
<div class="container mt-4">
    <h2>Perfil de Usuario</h2>
    <hr>
    <div class="card">
        <div class="card-body">
            <h5 class="card-title">{{ user.get_full_name|default:user.username }}</h5>
            <p class="card-text"><strong>Email:</strong> {{ user.email }}</p>
            <p class="card-text"><strong>Miembro desde:</strong> {{ user.date_joined|date:"d/m/Y" }}</p>
            
            <a href="{% url 'productos:listar' %}" class="btn btn-primary mt-2">Volver a la tienda</a>
        </div>
    </div>
</div>
{% endblock %}
