{% extends "base.html" %}

{% block title %}Registro - Ecommerce{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow">
            <div class="card-header bg-dark text-white text-center">
                <h4 class="mb-0">Crear Cuenta</h4>
            </div>
            <div class="card-body">
                <!-- CORREGIDO: 'usuarios:registrarse' en lugar de 'usuarios:registro' -->
                <form method="post" action="{% url 'usuarios:registrarse' %}">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-success w-100 mt-3">Registrarse</button>
                </form>
                <div class="text-center mt-3">
                    <small>¿Ya tienes cuenta? <a href="{% url 'usuarios:login' %}">Inicia sesión aquí</a></small>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
